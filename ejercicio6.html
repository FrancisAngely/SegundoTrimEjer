    • iniciarDescarga(nombreArchivo, callback): Recibe el nombre del archivo y simula un retraso de

    • progresarDescarga(nombreArchivo, callback): Simula el progreso de descarga cada 1 segundo,

    • finalizarDescarga(nombreArchivo, callback): Simula la finalización de la descarga después de 2

        //Promesas
        function iniciarDescarga(nombreArchivo) {
            return new Promise((resolve, reject) => {
                console.log(`Iniciando descarga de ${nombreArchivo}...`);
                setTimeout(() => {
                    console.log(`Descarga de ${nombreArchivo} ha comenzado.`);
                    resolve();
                }, 2000);
            });
        }

        function progresarDescarga(nombreArchivo) {
            console.log('progeso de descargar iniciado...');
            return new Promise((resolve, reject) => {
                let progreso = 0;
                const intervalo = setInterval(() => {
                    progreso += 25;
                    console.log(`Descargando... ${progreso}%`);
                    const progresoElemento = document.getElementById("progreso");
                    progresoElemento.style.width = progreso + '%';
                    if (progreso >= 100) {
                        clearInterval(intervalo);
                        resolve();}
                }, 1000);
            });
        }

        function finalizarDescarga(nombreArchivo) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    console.log(`Descarga completada: ${nombreArchivo}`);
                    resolve();
                }, 2000);
            });
        }

        async function descargarArchivo(nombreArchivo) {
            await iniciarDescarga(nombreArchivo);
            await progresarDescarga(nombreArchivo);
            await finalizarDescarga(nombreArchivo);
            console.log("Proceso de descarga finalizado.");
        }

        document.getElementById("inicio").addEventListener("click", () => {
            descargarArchivo("archivo.txt");
        });
